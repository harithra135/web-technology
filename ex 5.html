<!DOCTYPE html>
<html>

<head>

    <title>Supermarket Billing</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #eef6ff;
        }

        .bill {
            width: 90%;
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            border: 2px solid #1565c0;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #1565c0;
            margin: 5px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .product {
            padding: 12px;
            background: #f5faff;
            border: 1px solid #90caf9;
            border-radius: 8px;
        }

        h3 {
            text-align: center;
            margin: 5px;
        }

        label {
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 7px;
            margin: 4px 0 8px;
        }

        button {
            display: block;
            margin: 15px auto;
            padding: 10px 25px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        #result {
            text-align: center;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 8px;
        }

        /* Fits smaller screens */
        @media (max-width: 700px) {

            .products {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="bill">

    <h1>Supermarket Bill</h1>


    <div class="products">

        <!-- Product 1 -->

        <div class="product">

            <h3>Product 1</h3>

            <label>Quantity</label>

            <input type="number"
                   id="q1"
                   placeholder="Quantity">

            <label>Unit Price</label>

            <input type="number"
                   id="p1"
                   placeholder="Price">

        </div>


        <!-- Product 2 -->

        <div class="product">

            <h3>Product 2</h3>

            <label>Quantity</label>

            <input type="number"
                   id="q2"
                   placeholder="Quantity">

            <label>Unit Price</label>

            <input type="number"
                   id="p2"
                   placeholder="Price">

        </div>


        <!-- Product 3 -->

        <div class="product">

            <h3>Product 3</h3>

            <label>Quantity</label>

            <input type="number"
                   id="q3"
                   placeholder="Quantity">

            <label>Unit Price</label>

            <input type="number"
                   id="p3"
                   placeholder="Price">

        </div>

    </div>


    <button onclick="generateBill()">
        Generate Bill
    </button>


    <div id="result">

        <b>Bill Summary</b>
        <p>Enter product details and click Generate Bill.</p>

    </div>

</div>


<script>

    function calculateProduct(quantity, price) {

        return quantity * price;

    }


    function generateBill() {

        let total = 0;

        for (let i = 1; i <= 3; i++) {

            let quantity =
                Number(document.getElementById("q" + i).value);

            let price =
                Number(document.getElementById("p" + i).value);

            total += calculateProduct(quantity, price);
        }


        let discount = 0;

        if (total > 2000) {

            discount = total * 0.10;

        }


        let finalAmount = total - discount;


        document.getElementById("result").innerHTML =

            "<b>Bill Summary</b>" +

            "<p>Total: ₹" + total.toFixed(2) + "</p>" +

            "<p>Discount: ₹" + discount.toFixed(2) + "</p>" +

            "<p><b>Final Amount: ₹" +
            finalAmount.toFixed(2) +
            "</b></p>";

    }

</script>

</body>

</html>
